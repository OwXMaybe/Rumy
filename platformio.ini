; Rumy - ESP32-2432S028R (CYD) masaustu asistani
;
; Panel tipi TEK yerden secilir: asagidaki [rumy] bolumundeki "panel" degeri.
;   ILI9341 : cogu CYD (varsayilan)
;   ST7789  : bazi yeni CYD'ler (renkler/yon bozuksa bunu deneyin)
; Ayrica hazir ortam: pio run -e cyd_st7789

[platformio]
default_envs = cyd
extra_configs = secrets*.ini

[rumy]
panel = ILI9341
version = 1.3.0
base_flags =
	-D RUMY_VERSION=\"${rumy.version}\"
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	-D ARDUINOJSON_USE_DOUBLE=0
	-D ARDUINOJSON_USE_LONG_LONG=0
	-D ARDUINOJSON_POOL_CAPACITY=32
	-D CORE_DEBUG_LEVEL=1
	-O2
lib_deps =
	lvgl/lvgl@9.5.0
	lovyan03/LovyanGFX@1.2.30
	bblanchon/ArduinoJson@7.4.3
	tzapu/WiFiManager@2.0.17

[env:cyd]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.partitions = partitions/rumy_4mb.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 460800
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_unflags = -Os
build_flags =
	${rumy.base_flags}
	-D RUMY_PANEL_${rumy.panel}
build_src_flags =
	-Wall
	-Wextra
lib_deps = ${rumy.lib_deps}
lib_ignore =
	LittleFS
	FFat
	SPIFFS
extra_scripts =
	pre:tools/build_web.py
	post:tools/post_build.py

[env:cyd_st7789]
extends = env:cyd
build_flags =
	${rumy.base_flags}
	-D RUMY_PANEL_ST7789

[env:cyd_endurance]
extends = env:cyd
build_flags =
	${rumy.base_flags}
	-D RUMY_PANEL_${rumy.panel}
	-D RUMY_ENDURANCE=1

[env:cyd_prof]
extends = env:cyd
build_flags =
	${rumy.base_flags}
	-D RUMY_PANEL_${rumy.panel}
	-D RUMY_PROFILE=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
	-std=gnu++17
	-D ARDUINOJSON_USE_DOUBLE=0
	-D ARDUINOJSON_USE_LONG_LONG=0
	-D ARDUINOJSON_POOL_CAPACITY=32
	-D RUMY_NATIVE=1
	-Wall
	-Wextra
lib_deps =
	bblanchon/ArduinoJson@7.4.3
lib_compat_mode = off
