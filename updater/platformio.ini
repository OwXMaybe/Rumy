; Rumy guncelleyici: ota_1 ("updater") bolumunde duran kucuk uygulama.
; Ana uygulama yeni yazilimi SD karta (/rumy/guncelleme.bin) yazip yeniden baslayinca bu calisir: dosyayi SHA-256 ile
; dogrular, ana bolume (ota_0, "app0") kopyalar, ana bolumden acilir. Derleme: pio run -d updater
; Cikti tools/post_build.py tarafindan dist/Rumy-guncelleyici*.bin olarak kopyalanir ve ana yuklemeye eklenir.

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.partitions = ../partitions/rumy_4mb.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
	-Os
	-I ../src
	-I ../lib/rumy_core/src
	-D CORE_DEBUG_LEVEL=0
	-D RUMY_PANEL_ILI9341
build_src_flags =
	-Wall
	-Wextra
lib_deps = lovyan03/LovyanGFX@1.2.30
lib_ignore =
	LittleFS
	FFat
	SPIFFS
extra_scripts =
	pre:../tools/path_map.py
	post:copy_bin.py

[env:cyd_st7789]
extends = env:cyd
build_flags =
	-Os
	-I ../src
	-I ../lib/rumy_core/src
	-D CORE_DEBUG_LEVEL=0
	-D RUMY_PANEL_ST7789
